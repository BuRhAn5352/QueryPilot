<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask your database</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px 12px; font-size: 1rem; border: 1px solid #bbb; border-radius: 8px; }
  button { padding: 10px 18px; font-size: 1rem; border: 0; border-radius: 8px; background: #2b59c3; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .chips { margin: 10px 0 20px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-size: .85rem; padding: 4px 10px; background: #eef1f7; border-radius: 99px; cursor: pointer; }
  #answer { font-size: 1.1rem; margin: 20px 0 8px; line-height: 1.5; }
  #error { color: #b00020; }
  pre { background: #f5f5f5; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: .85rem; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  th, td { border-bottom: 1px solid #ddd; padding: 6px 8px; text-align: left; }
  th { background: #fafafa; }
  details { margin-top: 12px; }
</style>
</head>
<body>
<h1>Ask your database</h1>
<form id="f">
  <input id="q" placeholder="e.g. Which product sold the most last month?" autocomplete="off" autofocus>
  <button id="go">Ask</button>
</form>
<div class="chips" id="chips"></div>
<div id="answer"></div>
<div id="error"></div>
<details id="sqlBox" hidden><summary>SQL used</summary><pre id="sql"></pre></details>
<details id="rowsBox" hidden><summary>Raw rows</summary><div id="rows"></div></details>

<script>
const $ = id => document.getElementById(id);
const examples = [
  "Which product sold the most last month?",
  "Total revenue by category in October 2026",
  "Which store had the highest sales last month?",
  "Average customer feedback by payment method",
  "Top 5 customers by spending this year",
];
examples.forEach(t => {
  const s = document.createElement("span");
  s.textContent = t;
  s.onclick = () => { $("q").value = t; $("f").requestSubmit(); };
  $("chips").appendChild(s);
});

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (!question) return;
  $("go").disabled = true;
  $("answer").textContent = "Thinking...";
  $("error").textContent = "";
  $("sqlBox").hidden = $("rowsBox").hidden = true;
  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Request failed");
    $("answer").textContent = data.answer;
    $("sql").textContent = data.sql;
    $("sqlBox").hidden = false;
    renderTable(data.columns, data.rows);
  } catch (err) {
    $("answer").textContent = "";
    $("error").textContent = err.message;
  } finally {
    $("go").disabled = false;
  }
});

function renderTable(cols, rows) {
  const t = document.createElement("table");
  const head = t.insertRow();
  cols.forEach(c => { const th = document.createElement("th"); th.textContent = c; head.appendChild(th); });
  rows.forEach(r => {
    const tr = t.insertRow();
    r.forEach(v => { tr.insertCell().textContent = v === null ? "NULL" : v; });
  });
  $("rows").replaceChildren(t);
  $("rowsBox").hidden = false;
}
</script>
</body>
</html>
